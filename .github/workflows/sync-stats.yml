name: Sync read stats

on:
  schedule:
    # Daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run sync-stats
        env:
          GOATCOUNTER_SITE: ${{ secrets.GOATCOUNTER_SITE }}
          GOATCOUNTER_API_TOKEN: ${{ secrets.GOATCOUNTER_API_TOKEN }}
      - name: Commit updated stats.json
        run: |
          git config user.name "thedukepost-bot"
          git config user.email "bot@thedukepost.com"
          git add src/data/stats.json
          git diff --staged --quiet || git commit -m "chore: sync read stats"
          git push
